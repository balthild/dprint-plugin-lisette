[package]
name = "dprint-plugin-lisette"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
authors = ["Balthild <ibalthild@gmail.com>"]
keywords = ["import", "formatter", "typescript", "javascript"]
description = "Lisette formatter plugin for dprint."
repository = "https://github.com/balthild/dprint-plugin-lisette"

[lib]
name = "plugin"
crate-type = ["lib", "cdylib"]

[dependencies]
dprint-core = { version = "0.75.2", features = ["wasm"] }
lisette-syntax = "=0.13.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[profile.release]
opt-level = 3
debug = false
lto = true
debug-assertions = false
overflow-checks = false
panic = "abort"
