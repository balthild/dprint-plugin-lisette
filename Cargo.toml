[package]
name = "dprint-plugin-lisette"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
authors = ["Balthild <ibalthild@gmail.com>"]
keywords = ["import", "formatter", "typescript", "javascript"]
description = "Lisette formatter plugin for dprint."
repository = "https://github.com/balthild/dprint-plugin-lisette"

[lib]
crate-type = ["lib", "cdylib"]

[features]
plugin = ["dprint-core/wasm"]
tracing = ["dprint-core/tracing"]

[dependencies]
dprint-core = "0.75.2"
lisette-syntax = "=0.13.0"
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = 3
debug = false
lto = true
debug-assertions = false
overflow-checks = false
panic = "abort"

[package.metadata.release]
pre-release-commit-message = "chore: release {{crate_name}} v{{version}}"
tag-message = "chore: release {{crate_name}} v{{version}}"
